<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>전국 로컬 맛집 리스트</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div>
        <p class="eyebrow">Local Restaurant Tracker</p>
        <h1>전국 로컬 맛집 리스트</h1>
      </div>
      <div class="header-meta">
        <span id="totalCount">0곳</span>
        <span id="lastUpdated">검증일 없음</span>
      </div>
      <div class="auth-box">
        <span id="authStatus">로그인 없이 둘러보는 중</span>
        <button id="loginButton" type="button">카카오 로그인</button>
        <button id="logoutButton" type="button" hidden>로그아웃</button>
      </div>
    </header>

    <main>
      <section class="toolbar" aria-label="맛집 검색 및 필터">
        <label class="search-box">
          <span>검색</span>
          <input id="searchInput" type="search" placeholder="지역, 식당명, 메뉴" autocomplete="off" />
        </label>

        <label>
          <span>지역</span>
          <select id="regionFilter">
            <option value="">전체 지역</option>
          </select>
        </label>

        <div class="segmented" role="group" aria-label="영업 상태">
          <button class="active" type="button" data-status="">전체</button>
          <button type="button" data-status="OPEN">영업 중</button>
          <button type="button" data-status="CLOSED">폐업</button>
          <button type="button" data-status="EXCLUDED">제외</button>
        </div>
      </section>

      <section class="summary-grid" aria-label="요약">
        <article>
          <span>전체 등록</span>
          <strong id="summaryTotal">0</strong>
        </article>
        <article>
          <span>영업 중</span>
          <strong id="summaryOpen">0</strong>
        </article>
        <article>
          <span>폐업 표시</span>
          <strong id="summaryClosed">0</strong>
        </article>
      </section>

      <section class="region-list" aria-label="지역별 맛집 목록">
        <div id="restaurantList"></div>
        <p id="emptyState" class="empty-state" hidden>조건에 맞는 맛집이 없습니다.</p>
      </section>
    </main>

    <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
    <script src="./app.js" type="module"></script>
  </body>
</html>
